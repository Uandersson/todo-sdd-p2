<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List - SDD V1</title>
    <style>
      body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
      .completed { text-decoration: line-through; color: gray; }
      ul { list-style-type: none; padding: 0; }
      li { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    </style>
  </head>
  <body>
    <h1>Minhas Tarefas</h1>
    
    <div>
      <input type="text" id="taskInput" placeholder="Nova tarefa..." />
      <button id="addButton">Adicionar</button>
    </div>

    <ul id="taskList"></ul>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
